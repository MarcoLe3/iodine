name: Server CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'server/tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      
      - name: Set up Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run test
        run: npm test